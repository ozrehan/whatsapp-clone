<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Web Clone</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/chatlist.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/bubbles.css">
<link rel="stylesheet" href="css/inputbar.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>
<div class="app">

  <!-- ================= LEFT: chat list ================= -->
  <aside class="sidebar">
    <div class="side-header">
      <img class="avatar" id="sideAvatar" src="https://picsum.photos/seed/rehan-self/80" alt="me">
      <div class="side-me">
        <div class="side-name" id="sideName">Rehan</div>
        <div class="side-sub">online</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnStatus" title="Status"><svg class="ic"><use href="assets/icons.svg#status"/></svg></button>
        <button class="icon-btn" id="btnStarred" title="Starred messages"><svg class="ic"><use href="assets/icons.svg#star"/></svg></button>
        <button class="icon-btn" id="btnSettings" title="Settings"><svg class="ic"><use href="assets/icons.svg#settings"/></svg></button>
        <button class="icon-btn" id="btnNewChat" title="New chat"><svg class="ic"><use href="assets/icons.svg#newchat"/></svg></button>
      </div>
    </div>

    <div class="status-strip" id="statusStrip"></div>

    <div class="search-wrap">
      <div class="search-box">
        <svg class="ic search-ic"><use href="assets/icons.svg#search"/></svg>
        <input id="searchInput" type="text" placeholder="Search or start new chat" autocomplete="off">
      </div>
    </div>

    <div class="archived-bar" id="archivedBar" style="display:none"></div>

    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- ================= RIGHT: conversation ================= -->
  <main class="main" id="mainPane" data-wallpaper="doodle">

    <div class="empty-state" id="emptyState">
      <svg class="ic big"><use href="assets/icons.svg#newchat"/></svg>
      <h1>WhatsApp Web</h1>
      <p>Now send and receive messages without keeping your phone online.<br>Select a chat on the left to start messaging.</p>
    </div>

    <div id="convView" style="display:none">
      <div class="conv-header">
        <button class="icon-btn conv-back" id="convBack" title="Back"><svg class="ic"><use href="assets/icons.svg#back"/></svg></button>
        <img class="avatar" id="convAvatar" src="" alt="">
        <div class="conv-who" id="convWho">
          <div class="conv-name" id="convName"></div>
          <div class="conv-status" id="convStatus"></div>
        </div>
        <div class="conv-actions">
          <button class="icon-btn" title="Video call"><svg class="ic"><use href="assets/icons.svg#video"/></svg></button>
          <button class="icon-btn" title="Voice call"><svg class="ic"><use href="assets/icons.svg#phone"/></svg></button>
          <button class="icon-btn" title="Search"><svg class="ic"><use href="assets/icons.svg#search"/></svg></button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="reply-preview" id="replyPreview" style="display:none">
        <div class="rp-body" id="replyPreviewText"></div>
        <button class="icon-btn" id="replyPreviewClose" title="Cancel reply"><svg class="ic"><use href="assets/icons.svg#x"/></svg></button>
      </div>

      <div class="attach-menu" id="attachMenu">
        <button class="attach-item" data-attach="photo"><svg class="ic"><use href="assets/icons.svg#photo"/></svg><span>Photos</span></button>
        <button class="attach-item" data-attach="doc"><svg class="ic"><use href="assets/icons.svg#doc"/></svg><span>Document</span></button>
        <button class="attach-item" data-attach="camera"><svg class="ic"><use href="assets/icons.svg#camera"/></svg><span>Camera</span></button>
      </div>

      <div class="emoji-picker" id="emojiPicker"></div>

      <div class="input-bar" id="inputBarWrap">
        <button class="icon-btn" id="emojiBtn" title="Emoji"><svg class="ic"><use href="assets/icons.svg#emoji"/></svg></button>
        <button class="icon-btn" id="clipBtn" title="Attach"><svg class="ic"><use href="assets/icons.svg#clip"/></svg></button>
        <input class="msg-input" id="msgInput" type="text" placeholder="Type a message" autocomplete="off">
        <button class="icon-btn" id="micBtn" title="Voice message"><svg class="ic"><use href="assets/icons.svg#mic"/></svg></button>
        <button class="send-btn" id="sendBtn" title="Send" style="display:none"><svg class="ic"><use href="assets/icons.svg#send"/></svg></button>
      </div>

      <div class="recorder" id="recorder">
        <span class="rec-dot"></span>
        <span class="rec-timer" id="recTimer">0:00</span>
        <span style="flex:1"></span>
        <button class="icon-btn rec-cancel" id="recCancel" title="Delete recording"><svg class="ic"><use href="assets/icons.svg#trash"/></svg></button>
        <button class="send-btn rec-send" id="recSend" title="Send"><svg class="ic"><use href="assets/icons.svg#send"/></svg></button>
      </div>
    </div>

    <!-- slide-over panel: contact info / starred / settings / status list -->
    <div class="panel-overlay" id="panelOverlay">
      <div class="panel">
        <div class="panel-head">
          <button class="icon-btn" id="panelClose" title="Close"><svg class="ic"><use href="assets/icons.svg#back"/></svg></button>
          <span class="panel-title" id="panelTitle"></span>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </div>
    </div>

    <!-- fullscreen status viewer -->
    <div class="status-viewer" id="statusViewer">
      <div class="sv-top">
        <div class="sv-header">
          <div class="sv-meta">
            <div class="sv-name" id="svName"></div>
            <div class="sv-time" id="svTime"></div>
          </div>
          <button class="icon-btn sv-close" id="svClose" title="Close"><svg class="ic"><use href="assets/icons.svg#x"/></svg></button>
        </div>
        <div id="svBars"></div>
      </div>
      <div class="sv-stage">
        <button class="sv-prev" id="svPrev" title="Previous"><svg class="ic"><use href="assets/icons.svg#chevron-left"/></svg></button>
        <img id="svImg" alt="">
        <button class="sv-next" id="svNext" title="Next"><svg class="ic"><use href="assets/icons.svg#chevron-right"/></svg></button>
      </div>
      <div class="sv-bottom">
        <div class="sv-caption" id="svCaption"></div>
        <input class="sv-reply" id="svReplyInput" type="text" placeholder="Reply" autocomplete="off">
      </div>
    </div>

  </main>
</div>

<!-- image lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <span class="lb-title" id="lightboxTitle"></span>
    <button class="icon-btn" id="lightboxClose" title="Close"><svg class="ic"><use href="assets/icons.svg#x"/></svg></button>
  </div>
  <img id="lightboxImg" alt="">
  <div class="lb-bottom"><span id="lightboxCap"></span></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/utils/dom.js"></script>
<script src="js/utils/format.js"></script>
<script src="js/data/chats.js"></script>
<script src="js/data/messages.js"></script>
<script src="js/data/statuses.js"></script>
<script src="js/data/replies.js"></script>
<script src="js/store.js"></script>
<script src="js/components/chatlist.js"></script>
<script src="js/components/chatview.js"></script>
<script src="js/components/bubbles.js"></script>
<script src="js/components/inputbar.js"></script>
<script src="js/components/infopanel.js"></script>
<script src="js/components/status.js"></script>
<script src="js/components/settings.js"></script>
<script src="js/bot.js"></script>
<script src="js/app.js"></script>
</body>
</html>
