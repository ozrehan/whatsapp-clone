<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Web Clone</title>
<style>
/* ============ WhatsApp Web dark theme ============ */
:root{
  --bg-app:#0b141a; --bg-panel:#111b21; --bg-header:#202c33; --bg-hover:#2a3942;
  --bg-incoming:#202c33; --bg-outgoing:#005c4b;
  --green:#00a884; --green-dark:#075e54; --tick-blue:#53bdeb;
  --text:#e9edef; --text-dim:#8696a0; --divider:#222d34;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg-app);color:var(--text);
  display:flex;height:100vh;overflow:hidden;font-size:15px}
.app{display:flex;width:100%;height:100vh}
svg{display:block}

/* ============ Left: chat list panel ============ */
.sidebar{width:35%;min-width:320px;max-width:440px;background:var(--bg-panel);
  border-right:1px solid var(--divider);display:flex;flex-direction:column;flex-shrink:0}
.side-header{background:var(--bg-header);padding:10px 16px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer}
.side-header h2{font-size:19px;font-weight:600;flex:1}
.icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:50%;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--bg-hover)}
.icon-btn svg{width:24px;height:24px;fill:currentColor}
.search-wrap{padding:8px 12px;border-bottom:1px solid var(--divider)}
.search-box{background:var(--bg-header);border-radius:8px;display:flex;align-items:center;gap:12px;padding:8px 14px}
.search-box svg{width:18px;height:18px;fill:var(--text-dim);flex-shrink:0}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:14px;width:100%;font-family:inherit}
.search-box input::placeholder{color:var(--text-dim)}
.chat-list{flex:1;overflow-y:auto}
.chat-row{display:flex;gap:14px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--divider);align-items:center}
.chat-row:hover{background:var(--bg-header)}
.chat-row.active{background:var(--bg-hover)}
.chat-row .avatar{width:49px;height:49px}
.chat-info{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.chat-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.chat-name .pin{width:15px;height:15px;fill:var(--text-dim);flex-shrink:0}
.chat-time{font-size:12px;color:var(--text-dim);flex-shrink:0;margin-left:8px}
.chat-time.unread{color:var(--green);font-weight:600}
.chat-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-snippet{font-size:13.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-snippet .ticks{color:var(--text-dim);margin-right:2px}
.chat-snippet .ticks.blue{color:var(--tick-blue)}
.unread-badge{background:var(--green);color:var(--bg-app);font-size:12px;font-weight:600;
  min-width:21px;height:21px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  padding:0 6px;flex-shrink:0}

/* ============ Right: conversation ============ */
.main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;
  /* chat doodle pattern */
  background-color:var(--bg-app);
  background-image:radial-gradient(rgba(134,150,160,.14) 1px,transparent 1.6px);
  background-size:22px 22px}
.conv-header{background:var(--bg-header);padding:8px 16px;display:flex;align-items:center;gap:14px;z-index:2}
.conv-header .avatar{width:40px;height:40px}
.conv-who{flex:1;min-width:0;cursor:pointer}
.conv-name{font-size:16px}
.conv-status{font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-status.typing{color:var(--green);font-weight:600}
.conv-actions{display:flex;gap:4px}

/* empty state */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;color:var(--text-dim);text-align:center;padding:40px;border-bottom:6px solid var(--green-dark)}
.empty-state h1{font-size:32px;font-weight:300;color:var(--text)}
.empty-state p{max-width:460px;line-height:1.6;font-size:14px}
.empty-state .big{width:120px;height:120px;fill:var(--text-dim);opacity:.5}

/* messages */
.messages{flex:1;overflow-y:auto;padding:24px 70px;display:flex;flex-direction:column;gap:3px}
.day-pill{align-self:center;background:#182229;color:var(--text-dim);font-size:12.5px;
  padding:7px 14px;border-radius:8px;margin:10px 0;box-shadow:0 1px 1px rgba(0,0,0,.3)}
.msg-row{display:flex}
.msg-row.out{justify-content:flex-end}
.bubble{max-width:65%;padding:7px 10px 6px;border-radius:8px;position:relative;
  box-shadow:0 1px 1px rgba(0,0,0,.35);font-size:14.2px;line-height:1.45;overflow-wrap:break-word}
.msg-row.in .bubble{background:var(--bg-incoming);border-top-left-radius:2px}
.msg-row.out .bubble{background:var(--bg-outgoing);border-top-right-radius:2px}
/* tails (only on first bubble of a sender run) */
.msg-row.in .bubble.tail::before{content:"";position:absolute;top:0;left:-8px;
  border:4px solid transparent;border-top:8px solid var(--bg-incoming);border-right:8px solid var(--bg-incoming)}
.msg-row.out .bubble.tail::before{content:"";position:absolute;top:0;right:-8px;
  border:4px solid transparent;border-top:8px solid var(--bg-outgoing);border-left:8px solid var(--bg-outgoing)}
.sender-name{font-size:13px;font-weight:600;margin-bottom:2px}
.msg-text{white-space:pre-wrap}
.msg-meta{float:right;font-size:11px;color:#a8b3ba;margin:10px 0 0 10px;display:flex;align-items:center;gap:3px}
.msg-row.in .msg-meta{color:var(--text-dim)}
.ticks{font-size:13px;letter-spacing:-3px}
.ticks.blue{color:var(--tick-blue)}
/* typing indicator bubble */
.typing-dots{display:inline-flex;gap:4px;padding:6px 4px}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--text-dim);animation:blink 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ============ Input bar ============ */
.input-bar{background:var(--bg-header);padding:8px 14px;display:flex;align-items:center;gap:8px;z-index:2}
.input-bar .icon-btn svg{width:27px;height:27px}
.msg-input{flex:1;background:var(--bg-hover);border:none;outline:none;color:var(--text);
  border-radius:24px;padding:12px 18px;font-size:15px;font-family:inherit}
.msg-input::placeholder{color:var(--text-dim)}
.send-btn{background:var(--green);border:none;border-radius:50%;width:46px;height:46px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn svg{width:24px;height:24px;fill:#fff}
.send-btn:hover{filter:brightness(1.1)}
#micBtn{background:none}
#micBtn svg{fill:var(--text-dim)}

/* emoji picker */
.emoji-picker{position:absolute;left:24px;bottom:78px;background:#233138;border-radius:12px;
  padding:12px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;z-index:10;
  box-shadow:0 4px 24px rgba(0,0,0,.5);max-width:340px}
.emoji-picker.open{display:grid}
.emoji-picker button{background:none;border:none;font-size:24px;cursor:pointer;padding:6px;border-radius:8px}
.emoji-picker button:hover{background:var(--bg-hover)}

/* scrollbars */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#374045;border-radius:3px}

@media (max-width:760px){
  .sidebar{width:100%;max-width:none}
  .main{display:none}
  .messages{padding:16px 14px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ================= LEFT: chat list ================= -->
  <aside class="sidebar">
    <div class="side-header">
      <img class="avatar" src="https://picsum.photos/seed/rehan-self/80" alt="me" title="Profile">
      <h2>Chats</h2>
      <!-- status (circle) icon -->
      <button class="icon-btn" title="Status"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm-1.2-5.7 4-4-1.1-1.1-2.9 2.9-1.5-1.5-1.1 1.1z" opacity=".9"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 2.4"/></svg></button>
      <!-- new chat icon -->
      <button class="icon-btn" title="New chat"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z" opacity=".0"/><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg></button>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="searchInput" type="text" placeholder="Search or start new chat" autocomplete="off">
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- ================= RIGHT: conversation ================= -->
  <main class="main">
    <!-- empty state (shown until a chat is opened) -->
    <div class="empty-state" id="emptyState">
      <svg class="big" viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-9 9H7V9h4zm8 0h-4V9h4zm0-4H7V5h12z"/></svg>
      <h1>WhatsApp Web</h1>
      <p>Now send and receive messages without keeping your phone online.<br>Select a chat on the left to start messaging.</p>
    </div>

    <!-- conversation view -->
    <div id="convView" style="display:none;flex:1;flex-direction:column;min-height:0">
      <div class="conv-header">
        <img class="avatar" id="convAvatar" src="" alt="">
        <div class="conv-who">
          <div class="conv-name" id="convName"></div>
          <div class="conv-status" id="convStatus"></div>
        </div>
        <div class="conv-actions">
          <button class="icon-btn" title="Video call"><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
          <button class="icon-btn" title="Voice call"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.4 11.4 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg></button>
          <button class="icon-btn" title="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="emoji-picker" id="emojiPicker"></div>

      <div class="input-bar">
        <button class="icon-btn" id="emojiBtn" title="Emoji"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm4.2 14.2a1 1 0 0 1-1.4 1.4A7.2 7.2 0 0 1 12 18.4a7.2 7.2 0 0 1-2.8-.8 1 1 0 0 1 1.4-1.4 5.2 5.2 0 0 0 2.8.8 5.2 5.2 0 0 0 2.8-.8zM9 11.5A1.5 1.5 0 1 1 10.5 10 1.5 1.5 0 0 1 9 11.5zm6 0A1.5 1.5 0 1 1 16.5 10 1.5 1.5 0 0 1 15 11.5z"/></svg></button>
        <button class="icon-btn" id="clipBtn" title="Attach"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4.5 4.5 0 0 1-9 0V6a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V7H9v8.5a3 3 0 0 0 6 0V6a4.5 4.5 0 0 0-9 0v11.5a6 6 0 0 0 12 0V6h-1.5z"/></svg></button>
        <input class="msg-input" id="msgInput" type="text" placeholder="Type a message" autocomplete="off">
        <button class="icon-btn" id="micBtn" title="Voice message"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
        <button class="send-btn" id="sendBtn" title="Send" style="display:none"><svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </div>
    </div>
  </main>
</div>

<script>
"use strict";
/* =====================================================================
   WhatsApp Web clone — single file, vanilla JS.
   Data model: chats -> messages. Everything else is rendering + events.
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- seed data: 8 chats with realistic histories ---------- */
const CHATS = [
{
  id:"priya", name:"Priya Sharma", seed:"priya-ava", type:"dm", pinned:true,
  status:"online", unread:2, lastTime:"18:02",
  messages:[
    {from:"Priya Sharma", text:"did you see the new dune trailer??", time:"17:20", day:"yesterday"},
    {from:"me", text:"NOT YET don't spoil anything", time:"17:25", day:"yesterday", read:true},
    {from:"Priya Sharma", text:"the sandworm scene 😭", time:"17:26", day:"yesterday"},
    {from:"me", text:"watching tonight, pizza is already ordered 🍕", time:"17:40", day:"yesterday", read:true},
    {from:"Priya Sharma", text:"movie at 7? inox mantri square", time:"18:00", day:"today"},
    {from:"Priya Sharma", text:"i'll book 2 tickets, aisle seats", time:"18:02", day:"today"}
  ]
},
{
  id:"family", name:"Family ❤️", seed:"family-ava", type:"group", pinned:true,
  participants:["Amma","Appa","Sneha"], unread:0, lastTime:"09:23",
  messages:[
    {from:"Amma", text:"rehan beta, call when you are free", time:"09:12", day:"today"},
    {from:"Sneha", text:"amma he's probably asleep 😴", time:"09:15", day:"today"},
    {from:"me", text:"I'm awake! what's up", time:"09:20", day:"today", read:true},
    {from:"Appa", text:"your uncle is visiting on Sunday, be home by 6", time:"09:22", day:"today"},
    {from:"me", text:"ok will be there 👍", time:"09:23", day:"today", read:true}
  ]
},
{
  id:"arjun", name:"Arjun Mehta", seed:"arjun-ava", type:"dm",
  status:"online", unread:1, lastTime:"12:47",
  messages:[
    {from:"Arjun Mehta", text:"bro the match last night was insane", time:"12:40", day:"today"},
    {from:"me", text:"that last over!! kohli went beast mode 🔥", time:"12:45", day:"today", read:true},
    {from:"Arjun Mehta", text:"we're watching the final at my place, bring snacks", time:"12:47", day:"today"}
  ]
},
{
  id:"nova", name:"Project Nova 🚀", seed:"nova-ava", type:"group",
  participants:["Rahul","Neha","Vikram"], unread:1, lastTime:"11:30",
  messages:[
    {from:"Rahul", text:"standup in 10, don't be late 👀", time:"09:50", day:"today"},
    {from:"Neha", text:"the staging deploy is green ✅", time:"10:05", day:"today"},
    {from:"Vikram", text:"nice, I'll merge the auth PR after lunch", time:"10:20", day:"today"},
    {from:"me", text:"I'll pick up the dashboard tickets", time:"10:25", day:"today", read:true},
    {from:"Rahul", text:"client demo moved to Thursday btw", time:"11:30", day:"today"}
  ]
},
{
  id:"mom", name:"Mom", seed:"mom-ava", type:"dm",
  status:"last seen today at 08:15", unread:0, lastTime:"20:16",
  messages:[
    {from:"Mom", text:"did you eat?", time:"20:10", day:"yesterday"},
    {from:"me", text:"yes amma, had dinner", time:"20:15", day:"yesterday", read:true},
    {from:"Mom", text:"good. don't skip breakfast tomorrow", time:"20:16", day:"yesterday"},
    {from:"me", text:"😅 ok", time:"20:18", day:"yesterday", read:true}
  ]
},
{
  id:"college", name:"College Gang", seed:"college-ava", type:"group",
  participants:["Farhan","Divya","Zoya","Kiran"], unread:1, lastTime:"14:16",
  messages:[
    {from:"Farhan", text:"goa trip planning starts NOW 🏖️", time:"14:00", day:"today"},
    {from:"Divya", text:"finally!! december first week?", time:"14:05", day:"today"},
    {from:"Zoya", text:"I can only do 5th to 9th", time:"14:10", day:"today"},
    {from:"Kiran", text:"flights are cheap right now, we should book soon", time:"14:12", day:"today"},
    {from:"me", text:"I'm in, let's make a sheet", time:"14:15", day:"today", read:true},
    {from:"Farhan", text:"rehan making sheets = it's serious 😂", time:"14:16", day:"today"}
  ]
},
{
  id:"ravi", name:"Ravi Kumar", seed:"ravi-ava", type:"dm",
  status:"last seen yesterday at 22:40", unread:1, lastTime:"19:06",
  messages:[
    {from:"Ravi Kumar", text:"mama asked about your job, told him you're building apps", time:"19:00", day:"yesterday"},
    {from:"me", text:"haha thanks for the PR", time:"19:05", day:"yesterday", read:true},
    {from:"Ravi Kumar", text:"anytime bro. diwali plans?", time:"19:06", day:"yesterday"}
  ]
},
{
  id:"sneha", name:"Sneha Rao", seed:"sneha-ava", type:"dm",
  status:"online", unread:1, lastTime:"16:40",
  messages:[
    {from:"Sneha Rao", text:"can you review my resume tonight?", time:"16:30", day:"today"},
    {from:"me", text:"send it over", time:"16:35", day:"today", read:true},
    {from:"Sneha Rao", text:"sent! also don't tell amma about the mumbai interview 🤫", time:"16:40", day:"today"}
  ]
}
];
/* group sender name colors (WhatsApp-style palette) */
const NAME_COLORS = {Amma:"#ff9f43", Appa:"#53bdeb", Sneha:"#e91e63", Rahul:"#00a884",
  Neha:"#35cd96", Vikram:"#a06ee1", Farhan:"#53bdeb", Divya:"#e91e63", Zoya:"#a06ee1", Kiran:"#ff9f43"};
const colorFor = n => NAME_COLORS[n] || "#35cd96";

/* seed history: all my old messages are sent+read */
CHATS.forEach(c=>c.messages.forEach(m=>{ if(m.from==="me"){ m.sent=true; m.read=true; } }));

/* ---------- state ---------- */
let activeChat = null;   // chat object currently open
let searchTerm = "";
const nowTime = () => { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };

/* =====================================================================
   CHAT LIST
   ===================================================================== */
function snippetFor(chat){
  const m = chat.messages[chat.messages.length-1];
  if(!m) return "";
  let txt = m.text;
  if(chat.type==="group" && m.from!=="me") txt = m.from.split(" ")[0]+": "+txt;
  if(m.from==="me") txt = '<span class="ticks'+(m.read?" blue":"")+'">✓✓</span> '+esc(txt);
  else txt = esc(txt);
  return txt;
}
function sortedChats(){
  // pinned first, then by last activity order (seed order is already recent-first)
  return [...CHATS].sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0));
}
function renderChatList(){
  const list = $("chatList"); list.innerHTML = "";
  const term = searchTerm.trim().toLowerCase();
  for(const c of sortedChats()){
    if(term && !(c.name.toLowerCase().includes(term) ||
       c.messages.some(m=>m.text.toLowerCase().includes(term)))) continue;
    const row = document.createElement("div");
    row.className = "chat-row"+(activeChat===c?" active":"");
    row.innerHTML =
      '<img class="avatar" src="https://picsum.photos/seed/'+c.seed+'/100" alt="">'+
      '<div class="chat-info">'+
        '<div class="chat-top"><span class="chat-name">'+esc(c.name)+
          (c.pinned?'<svg class="pin" viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>':"")+
        '</span><span class="chat-time'+(c.unread?" unread":"")+'">'+c.lastTime+'</span></div>'+
        '<div class="chat-bottom"><span class="chat-snippet">'+snippetFor(c)+'</span>'+
          (c.unread?'<span class="unread-badge">'+c.unread+'</span>':"")+
        '</div>'+
      '</div>';
    row.onclick = () => openChat(c);
    list.appendChild(row);
  }
}

/* =====================================================================
   CONVERSATION
   ===================================================================== */
function groupStatus(chat){
  return "You, " + chat.participants.join(", ");
}
function openChat(chat){
  activeChat = chat;
  chat.unread = 0;                       // opening clears unread
  $("emptyState").style.display = "none";
  $("convView").style.display = "flex";
  $("convAvatar").src = "https://picsum.photos/seed/"+chat.seed+"/100";
  $("convName").textContent = chat.name;
  $("convStatus").className = "conv-status";
  $("convStatus").textContent = chat.type==="group" ? groupStatus(chat) : chat.status;
  renderChatList();
  renderMessages();
}
function tickHtml(read){
  return '<span class="ticks'+(read?" blue":"")+'">✓✓</span>';
}
/* single ✓ before 'sent' flips to ✓✓ grey, then ✓✓ blue when read */
function msgTicks(m){
  if(!m.sent) return '<span class="ticks">✓</span>';
  return '<span class="ticks'+(m.read?" blue":"")+'">✓✓</span>';
}
function renderMessages(){
  const box = $("messages"); box.innerHTML = "";
  const msgs = activeChat.messages;
  let lastDay = null;
  msgs.forEach((m,i)=>{
    if(m.day!==lastDay){
      lastDay = m.day;
      const pill = document.createElement("div");
      pill.className = "day-pill"; pill.textContent = m.day.toUpperCase();
      box.appendChild(pill);
    }
    const out = m.from==="me";
    const row = document.createElement("div");
    row.className = "msg-row "+(out?"out":"in");
    // tail only on first bubble of a consecutive sender run
    const prev = msgs[i-1];
    const showTail = !prev || prev.from!==m.from || prev.day!==m.day;
    let sender = "";
    if(!out && activeChat.type==="group")
      sender = '<div class="sender-name" style="color:'+colorFor(m.from)+'">'+esc(m.from)+'</div>';
    const meta = out
      ? '<span class="msg-meta">'+m.time+' '+msgTicks(m)+'</span>'
      : '<span class="msg-meta">'+m.time+'</span>';
    row.innerHTML = '<div class="bubble'+(showTail?" tail":"")+'">'+sender+
      '<span class="msg-text">'+esc(m.text)+'</span>'+meta+'</div>';
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}

/* =====================================================================
   SENDING + simulated ticks + contextual bot replies
   ===================================================================== */
function updateMsgInputUI(){
  const has = $("msgInput").value.trim().length>0;
  $("sendBtn").style.display = has?"flex":"none";
  $("micBtn").style.display = has?"none":"flex";
}
function sendMessage(){
  const inp = $("msgInput"), text = inp.value.trim();
  if(!text || !activeChat) return;
  const chat = activeChat;
  const m = {from:"me", text, time:nowTime(), day:"today", read:false};
  chat.messages.push(m); chat.lastTime = m.time;
  inp.value = ""; updateMsgInputUI();
  renderMessages(); renderChatList();
  // ✓ single → ✓✓ grey (sent) → ✓✓ blue (read)
  setTimeout(()=>{ if(activeChat===chat){ renderMessages(); } }, 10); // paint single tick first
  setTimeout(()=>{ m.sent=true; renderMessages(); renderChatList(); }, 800);
  setTimeout(()=>{ m.read=true; renderMessages(); renderChatList(); }, 1600);
  // contact "types" then replies
  setTimeout(()=>startTyping(chat), 2200);
}
/* --- message sending --- */

/* --- bot brain: contextual replies per chat --- */
const FALLBACKS = [
  "haha nice 😄","okay okay","fr tho","lol exactly","say less 😎","bet 👍","interesting... tell me more",
  "no way 😂","that's actually cool","on my way, 5 mins"
];
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function botReply(chat, userText){
  const t = userText.toLowerCase();
  const has = (...ws) => ws.some(w=>t.includes(w));
  if(chat.id==="priya"){
    if(has("book","ticket","7")) return "booked! row F, aisle seats 🎟️";
    if(has("dune","movie","watch","trailer")) return "the popcorn better be extra buttery 🍿";
    if(has("pizza")) return "extra cheese or we riot 🧀";
    if(has("?")) return "hmm let me check and tell you";
    return pick(["yesss","haha exactly","ok done 😌","see you at 7!"]);
  }
  if(chat.id==="family"){
    const who = pick(chat.participants);
    const replies = {
      Amma:["ok beta ❤️","take care, eat on time","god bless you"],
      Appa:["noted.","call your uncle too","drive safe"],
      Sneha:["lol 😂","omg finally","+1"]
    };
    return {from:who, text:pick(replies[who])};
  }
  if(chat.id==="arjun"){
    if(has("cricket","match","kohli","six","final")) return "that six over long-on though 🔥";
    if(has("snack")) return "chips and cold drinks, sorted 🥤";
    if(has("?")) return "my place, 6:30. don't be late this time";
    return pick(["for real","let's gooo","haha true"]);
  }
  if(chat.id==="nova"){
    const who = pick(chat.participants);
    const replies = {
      Rahul:["noted, updating the board ✅","let's sync after standup","client will love this"],
      Neha:["deploy pipeline is happy today 🟢","I'll take the frontend bits","+1 to that"],
      Vikram:["auth PR is ready for review 👀","on it, pushing in 10","nice catch"]
    };
    return {from:who, text:pick(replies[who])};
  }
  if(chat.id==="mom") return pick(["ok take care ❤️","call me tonight","don't forget your jacket"]);
  if(chat.id==="college"){
    const who = pick(chat.participants);
    const replies = {
      Farhan:["ok adding it to the sheet 📝","goa is happeningggg","budget mode: ON"],
      Divya:["already checking airbnbs 🏠","december can't come sooner","packing list incoming"],
      Zoya:["5th-9th works for me ✅","count me in!","window seat is mine"],
      Kiran:["saw return flights at 4.2k","book before prices jump ✈️","splitting costs 4 ways?"]
    };
    return {from:who, text:pick(replies[who])};
  }
  if(chat.id==="ravi"){
    if(has("diwali","plan")) return "coming home on the 28th, crackers ready 🪔";
    return pick(["haha","true true","we should catch up soon"]);
  }
  if(chat.id==="sneha"){
    if(has("resume")) return "you're the best 🥺";
    if(has("mumbai","interview","secret")) return "your secret's safe with me 🤫 good luck!!";
    return pick(["thanks rehan!","lol","okay"]);
  }
  return pick(FALLBACKS);
}
function startTyping(chat){
  if(!activeChat || activeChat!==chat) return; // only animate if still viewing
  const status = $("convStatus");
  status.textContent = "typing..."; status.classList.add("typing");
  // typing bubble
  const box = $("messages");
  const row = document.createElement("div");
  row.className = "msg-row in"; row.id = "typingRow";
  const who = chat.type==="group" ? pick(chat.participants) : chat.name;
  row.innerHTML = '<div class="bubble tail">'+
    (chat.type==="group"?'<div class="sender-name" style="color:'+colorFor(who)+'">'+esc(who)+'</div>':"")+
    '<span class="typing-dots"><span></span><span></span><span></span></span></div>';
  box.appendChild(row); box.scrollTop = box.scrollHeight;
  setTimeout(()=>{
    const tr = $("typingRow"); if(tr) tr.remove();
    status.classList.remove("typing");
    status.textContent = chat.type==="group" ? groupStatus(chat) : chat.status;
    if(activeChat!==chat) { // reply lands even if user switched chats (unread++)
      const r = botReply(chat, chat.messages.filter(m=>m.from==="me").slice(-1)[0].text);
      pushReply(chat, r); chat.unread++; chat.lastTime = nowTime();
      renderChatList(); return;
    }
    const lastUser = chat.messages.filter(m=>m.from==="me").slice(-1)[0].text;
    pushReply(chat, botReply(chat, lastUser));
    chat.lastTime = nowTime();
    renderMessages(); renderChatList();
  }, 1400 + Math.random()*1200);
}
function pushReply(chat, reply){
  if(typeof reply === "string")
    chat.messages.push({from:chat.name, text:reply, time:nowTime(), day:"today"});
  else
    chat.messages.push({from:reply.from, text:reply.text, time:nowTime(), day:"today"});
}

const EMOJIS = ["😀","😂","😍","🥰","😎","😭","😅","🤔","👍","👎","🙏","👏","🔥","❤️","💔","✨",
  "🎉","🎂","🍕","☕","⚽","🏏","🎬","🎵","✈️","🏖️","💯","🤫","😴","👀","✅","🤝"];
function buildEmojiPicker(){
  const p = $("emojiPicker");
  EMOJIS.forEach(e=>{
    const b = document.createElement("button");
    b.textContent = e;
    b.onclick = ()=>{
      const inp = $("msgInput");
      const s = inp.selectionStart||inp.value.length, en = inp.selectionEnd||s;
      inp.value = inp.value.slice(0,s)+e+inp.value.slice(en);
      inp.focus(); inp.selectionStart = inp.selectionEnd = s+e.length;
      updateMsgInputUI();
    };
    p.appendChild(b);
  });
}

/* =====================================================================
   EVENTS + INIT
   ===================================================================== */
$("sendBtn").onclick = sendMessage;
$("msgInput").addEventListener("keydown", e=>{ if(e.key==="Enter") sendMessage(); });
$("msgInput").addEventListener("input", updateMsgInputUI);
$("searchInput").addEventListener("input", e=>{ searchTerm = e.target.value; renderChatList(); });
$("emojiBtn").onclick = e=>{ e.stopPropagation(); $("emojiPicker").classList.toggle("open"); };
document.addEventListener("click", e=>{
  if(!e.target.closest("#emojiPicker") && !e.target.closest("#emojiBtn"))
    $("emojiPicker").classList.remove("open");
});
$("clipBtn").onclick = ()=>{ $("msgInput").value += "📎 "; $("msgInput").focus(); updateMsgInputUI(); };
$("micBtn").onclick = ()=>{ $("msgInput").focus(); };

buildEmojiPicker();
renderChatList();
</script>
